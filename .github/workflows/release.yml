name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BINARY_NAME: cardman

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Pure-Go build (modernc.org/sqlite): every target cross-compiles
    # from a single Linux runner with CGO disabled.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PACKAGE_DIR="$RUNNER_TEMP/package"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE} -X main.builtBy=github-actions" \
            -o "$PACKAGE_DIR/${BINARY_NAME}${EXT}" \
            ./cmd

          cp LICENSE README.md "$PACKAGE_DIR/"

          if [ "$GOOS" = "windows" ]; then
            ASSET_NAME="${BINARY_NAME}_${VERSION}_${{ matrix.name }}.zip"
            (cd "$PACKAGE_DIR" && zip -q "$GITHUB_WORKSPACE/$ASSET_NAME" "${BINARY_NAME}${EXT}" LICENSE README.md)
          else
            ASSET_NAME="${BINARY_NAME}_${VERSION}_${{ matrix.name }}.tar.gz"
            tar -czf "$ASSET_NAME" -C "$PACKAGE_DIR" "${BINARY_NAME}" LICENSE README.md
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.BINARY_NAME }}_${{ github.ref_name }}_${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum dist/* > dist/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
