services:
  cardman:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardman:latest
    container_name: cardman
    environment:
      - DB_DSN=file:/app/data/cardman.db?_pragma=foreign_keys(1)
      - LOG_LEVEL=INFO
      # Uncomment for SSH server mode (run the serve-ssh command):
      # - SSH_PORT=2222
      # - SSH_HOST_KEY=/app/data/host_key
      # - API_KEY=your_tcgdex_api_key
    volumes:
      - cardman_data:/app/data
    # Uncomment to expose SSH server port:
    # ports:
    #   - "2222:2222"
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  cardman_data:
    driver: local
